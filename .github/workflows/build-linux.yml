name: Build Linux
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: audiolib-linux
          path: |
            release/*.AppImage
            release/*.deb
